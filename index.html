
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>FOOD ORDERING SYSTEM</h1>

        <div class="form-group">
            <label>Customer Name:</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>

        <div class="form-group">
            <label>Choose Food:</label>

            <select id="food">
                <option value="">-- Select Food --</option>
                <option value="Burger" data-price="80">Burger - ₱80</option>
                <option value="Pizza" data-price="120">Pizza - ₱120</option>
                <option value="Fried Chicken" data-price="100">Fried Chicken - ₱100</option>
                <option value="Spaghetti" data-price="90">Spaghetti - ₱90</option>
                <option value="French Fries" data-price="60">French Fries - ₱60</option>
            </select>
        </div>

        <div class="form-group">
            <label>Price:</label>
            <input type="text" id="price" value="₱0.00" readonly>
        </div>

        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" id="quantity" min="1" value="1">
        </div>

        <div class="form-group">
            <label>Total:</label>
            <input type="text" id="total" value="₱0.00" readonly>
        </div>

        <button id="placeOrder">PLACE ORDER</button>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
